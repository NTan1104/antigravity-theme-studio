[package]
name = "ats-theme"
version = "2.0.0"
edition = "2021"
description = "Pure-Rust Ultra-Low-RAM CDP Custom Theme, Live Video Media Server & Audio Engine for Antigravity, Antigravity IDE, and VS Code"
license = "MIT"

[lib]
name = "ats_theme"
path = "src/lib.rs"

[[bin]]
name = "ats-theme"
path = "src/main.rs"

[[bin]]
name = "ats-theme-daemon"
path = "src/bin/daemon.rs"

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.image]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3
